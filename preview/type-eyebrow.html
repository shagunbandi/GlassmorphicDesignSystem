<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; display:inline-block; margin-right:14px; padding:4px 0; }
  .row { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; margin-top:6px; }
  .swatch { width:10px; height:10px; border-radius:99px; display:inline-block; margin-right:6px; vertical-align:middle; }
  .caption { font-size:12px; color:rgba(255,255,255,.5); margin-top:14px; line-height:1.5; }
</style></head><body>
  <div class="row">
    <span class="eyebrow" style="color:#55ddb0"><span class="swatch" style="background:#55ddb0"></span>Active Adventure</span>
    <span class="eyebrow" style="color:#9bcbff"><span class="swatch" style="background:#9bcbff"></span>Upcoming Trip</span>
    <span class="eyebrow" style="color:#ff7e5f"><span class="swatch" style="background:#ff7e5f"></span>Past Memory</span>
    <span class="eyebrow" style="color:rgba(255,255,255,.6)"><span class="swatch" style="background:rgba(255,255,255,.6)"></span>Planning</span>
  </div>
  <div class="caption">Eyebrow labels — 11px / 700 / letter-spacing 0.18em. Always ALL CAPS. Used above hero titles to set trip status.</div>
</body></html>

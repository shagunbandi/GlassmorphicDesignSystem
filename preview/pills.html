<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body { margin:0; padding:22px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:9999px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .legend { font-size:11px; color:rgba(255,255,255,.45); letter-spacing:.18em; text-transform:uppercase; font-weight:700; width:88px; }
</style></head><body>
  <div class="row"><div class="legend">Place tones</div>
    <span class="pill" style="background:rgba(56,189,248,.18);color:rgba(224,242,254,.95)">Sky</span>
    <span class="pill" style="background:rgba(52,211,153,.14);color:rgba(209,250,229,.92)">Emerald</span>
    <span class="pill" style="background:rgba(251,191,36,.16);color:rgba(254,243,199,.95)">Amber</span>
    <span class="pill" style="background:rgba(148,163,184,.20);color:rgba(226,232,240,.90)">Slate</span>
  </div>
  <div class="row"><div class="legend">Status</div>
    <span class="pill" style="background:rgba(59,130,246,.70);color:#fff"><i class="fas fa-calendar-check"></i>Active</span>
    <span class="pill" style="background:rgba(168,85,247,.70);color:#fff"><i class="fas fa-lightbulb"></i>Planning</span>
    <span class="pill" style="background:rgba(155,203,255,.70);color:#003256"><i class="fas fa-rocket"></i>Upcoming</span>
    <span class="pill" style="background:rgba(255,126,95,.70);color:#fff"><i class="fas fa-photo-film"></i>Memory</span>
  </div>
  <div class="row"><div class="legend">Category</div>
    <span class="pill" style="background:rgba(255,255,255,.08);text-transform:none;letter-spacing:0">🏛️ Attraction</span>
    <span class="pill" style="background:rgba(255,255,255,.08);text-transform:none;letter-spacing:0">🍽️ Restaurant</span>
    <span class="pill" style="background:rgba(255,255,255,.08);text-transform:none;letter-spacing:0">✈️ Airport</span>
    <span class="pill" style="background:rgba(255,255,255,.08);text-transform:none;letter-spacing:0">🏨 Hotel</span>
  </div>
</body></html>

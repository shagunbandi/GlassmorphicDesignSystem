<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body { margin:0; padding:22px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .btn { font-family:inherit; font-size:14px; font-weight:500; border-radius:9999px; padding:8px 16px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; border:1px solid transparent; transition:all 200ms ease; }
  .btn-primary { background:#4f46e5; color:#fff; }
  .btn-primary:hover { background:#4338ca; }
  .btn-soft { background:rgba(155,203,255,.18); color:#dbeafe; border-color:rgba(155,203,255,.30); }
  .btn-soft:hover { background:rgba(155,203,255,.28); }
  .btn-ghost { background:transparent; color:rgba(255,255,255,.80); border-color:rgba(255,255,255,.14); }
  .btn-ghost:hover { background:rgba(255,255,255,.08); }
  .btn-danger { background:rgba(220,38,38,.20); color:#fecaca; border-color:rgba(220,38,38,.40); }
  .btn-icon { width:36px; height:36px; padding:0; justify-content:center; border-radius:10px; }
  .label { font-size:11px; color:rgba(255,255,255,.45); letter-spacing:.18em; text-transform:uppercase; font-weight:700; width:80px; }
</style></head><body>
  <div class="row"><div class="label">Primary</div>
    <button class="btn btn-primary"><i class="fas fa-share-alt"></i>Share Trip</button>
    <button class="btn btn-primary"><i class="fas fa-magic"></i>Optimize</button>
  </div>
  <div class="row"><div class="label">Soft</div>
    <button class="btn btn-soft"><i class="fas fa-route"></i>Maps</button>
    <button class="btn btn-soft"><i class="fas fa-camera"></i>Change Cover</button>
  </div>
  <div class="row"><div class="label">Ghost</div>
    <button class="btn btn-ghost"><i class="fas fa-eye"></i>View</button>
    <button class="btn btn-ghost btn-icon"><i class="fas fa-pen"></i></button>
    <button class="btn btn-ghost btn-icon"><i class="fas fa-chevron-up"></i></button>
  </div>
  <div class="row"><div class="label">Danger</div>
    <button class="btn btn-danger btn-icon"><i class="fas fa-trash-alt"></i></button>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body { margin:0; padding:24px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); }
  .card { width:320px; background:rgba(255,255,255,.10); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.18); border-radius:18px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,.20); }
  .hero { position:relative; height:140px; background:url('../assets/aurora-green.jpg') center/cover; filter:brightness(.78); }
  .badge { position:absolute; top:12px; right:12px; background:rgba(59,130,246,.70); color:#fff; font-size:11px; font-weight:600; padding:4px 10px; border-radius:9999px; backdrop-filter:blur(6px); text-transform:uppercase; letter-spacing:.04em; }
  .body { padding:16px 18px; }
  h3 { margin:0 0 6px; font-size:18px; font-weight:700; color:#fff; line-height:1.25; }
  p { margin:0 0 14px; font-size:13px; color:rgba(255,255,255,.6); line-height:1.45; }
  .info { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .chip { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); border-radius:8px; padding:8px 10px; font-size:12px; display:flex; align-items:center; gap:6px; color:rgba(255,255,255,.78); }
  .foot { border-top:1px solid rgba(255,255,255,.10); padding-top:12px; display:flex; justify-content:space-between; align-items:center; }
  .link { color:#9bcbff; font-size:13px; font-weight:500; display:inline-flex; gap:6px; align-items:center; }
</style></head><body>
  <div class="card">
    <div class="hero"><span class="badge"><i class="fas fa-calendar-check" style="margin-right:6px"></i>Active</span></div>
    <div class="body">
      <h3>Iceland Aurora Drive</h3>
      <p>Ten days chasing the green lights across the south coast.</p>
      <div class="info">
        <span class="chip"><i class="fas fa-calendar-alt" style="color:#10b981"></i>14 Mar – 24 Mar</span>
        <span class="chip"><i class="fas fa-clock" style="color:#f59e0b"></i>11 days</span>
      </div>
      <div class="foot">
        <span class="link">View Details <i class="fas fa-arrow-right"></i></span>
        <i class="fas fa-trash-alt" style="color:#fca5a5;font-size:14px"></i>
      </div>
    </div>
  </div>
</body></html>

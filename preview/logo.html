<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:#fff; display:flex; align-items:center; gap:18px; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .mark { width:56px; height:56px; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,.25); }
  .mark img { width:100%; height:100%; object-fit:cover; }
  .name { font-size:26px; font-weight:700; line-height:1; letter-spacing:-.01em; }
  .tag { display:block; font-size:10px; letter-spacing:.18em; color:rgba(255,255,255,.5); text-transform:uppercase; margin-top:4px; }
</style></head><body>
  <div class="lockup">
    <div class="mark"><img src="../assets/logo.jpg" alt=""></div>
    <div>
      <div class="name">Voyager</div>
      <span class="tag">Easy Adventure Planning</span>
    </div>
  </div>
</body></html>

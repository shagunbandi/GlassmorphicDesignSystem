<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:18px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sw { border-radius:14px; padding:14px; border:1px solid var(--glass-border-soft); height:96px; display:flex; flex-direction:column; justify-content:space-between; }
  .name { font-size:12px; font-weight:600; }
  .hex  { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); }
  .dot  { width:28px; height:28px; border-radius:8px; border:1px solid rgba(255,255,255,.18); }
</style></head><body>
<div class="row">
  <div class="sw" style="background:#9bcbff22"><div class="dot" style="background:#9bcbff"></div><div><div class="name">Brand Sky</div><div class="hex">#9bcbff</div></div></div>
  <div class="sw" style="background:#55ddb022"><div class="dot" style="background:#55ddb0"></div><div><div class="name">Brand Mint</div><div class="hex">#55ddb0</div></div></div>
  <div class="sw" style="background:#ff7e5f22"><div class="dot" style="background:#ff7e5f"></div><div><div class="name">Brand Coral</div><div class="hex">#ff7e5f</div></div></div>
  <div class="sw" style="background:#4f46e522"><div class="dot" style="background:#4f46e5"></div><div><div class="name">Interactive Indigo</div><div class="hex">#4f46e5</div></div></div>
</div>
</body></html>

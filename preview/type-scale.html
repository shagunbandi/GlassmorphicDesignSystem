<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); }
  .row { display:grid; grid-template-columns:60px 1fr; gap:14px; align-items:baseline; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .row:last-child { border:none; }
  .tag { font-family:var(--font-mono); font-size:11px; color:rgba(255,255,255,.4); }
</style></head><body>
  <div class="row"><div class="tag">36/700</div><div style="font-size:36px;font-weight:700;letter-spacing:-.01em;line-height:1.1">Daily Plan</div></div>
  <div class="row"><div class="tag">24/600</div><div style="font-size:24px;font-weight:600;line-height:1.2">Trip overview card</div></div>
  <div class="row"><div class="tag">18/600</div><div style="font-size:18px;font-weight:600">Place name on a card</div></div>
  <div class="row"><div class="tag">16/500</div><div style="font-size:16px;font-weight:500;color:rgba(255,255,255,.85)">Body — paragraph copy</div></div>
  <div class="row"><div class="tag">14/400</div><div style="font-size:14px;font-weight:400;color:rgba(255,255,255,.65)">Snippet · meta · description</div></div>
  <div class="row"><div class="tag">11/600</div><div style="font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(254,243,199,.95)">Pill label</div></div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:radial-gradient(circle at top right,#243b55,#141e30); font-family:var(--font-sans); color:var(--fg-1); }
  .legend { font-size:11px; color:rgba(255,255,255,.6); margin-bottom:12px; letter-spacing:.04em; text-transform:uppercase; font-weight:600; }
  .row { display:flex; align-items:flex-end; gap:10px; }
  .bar { background:rgba(155,203,255,.40); border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:6px 0; color:#0b1730; font-weight:600; font-size:10px; font-family:var(--font-mono); }
</style></head><body>
  <div class="legend">Spacing scale (Tailwind, 4px base)</div>
  <div class="row">
    <div class="bar" style="width:18px;height:18px">4</div>
    <div class="bar" style="width:24px;height:24px">8</div>
    <div class="bar" style="width:30px;height:36px">12</div>
    <div class="bar" style="width:40px;height:48px">16</div>
    <div class="bar" style="width:46px;height:60px">20</div>
    <div class="bar" style="width:52px;height:72px">24</div>
    <div class="bar" style="width:62px;height:96px">32</div>
    <div class="bar" style="width:72px;height:120px">48</div>
  </div>
</body></html>
